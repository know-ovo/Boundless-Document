[package]
name = "boundless_docs_desktop"
version = "0.1.0"
description = "Boundless Docs desktop demo"
authors = ["Boundless Docs"]
edition = "2021"

[lib]
name = "boundless_docs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
